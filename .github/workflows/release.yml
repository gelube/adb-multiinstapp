name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller

      - name: Run tests
        run: |
          pip install pytest
          pytest tests/ -q

      - name: Build exe
        run: pyinstaller adb-multiinstapp.spec

      - name: Package zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          Compress-Archive -Path "dist/adb-multiinstapp.exe" -DestinationPath "adb-multiinstapp-dist-$ver.zip"

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          files: adb-multiinstapp-dist-*.zip
          generate_release_notes: true
